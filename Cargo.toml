[workspace]
resolver = "2"
members = ["crates/iw-engine", "crates/iw-app"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
license = "LicenseRef-Proprietary"
publish = false

# Dependencies (compression, codecs) are optimised even in debug builds;
# unoptimised they make the test suite many times slower.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
