name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler; this installs it.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: bash scripts/ci-run.sh cargo clippy --workspace --all-targets --message-format=short -- -D warnings
      - run: bash scripts/ci-run.sh cargo test --workspace
      - run: bash scripts/check-layering.sh
      - run: bash scripts/ci-run.sh cargo build --release -p iw-app --message-format=short
      - name: Launch check
        run: ./target/release/imageworks --version
      - name: Open a document and export it, without a display
        run: |
          ./target/release/imageworks convert crates/iw-engine/tests/fixtures/v1.iwdoc target/smoke.png
          ./target/release/imageworks convert target/smoke.png target/smoke.jpg
          ./target/release/imageworks convert target/smoke.jpg target/smoke.iwdoc
          test -s target/smoke.png && test -s target/smoke.jpg && test -s target/smoke.iwdoc
      - name: Intel macOS also compiles
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --workspace --target x86_64-apple-darwin

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
