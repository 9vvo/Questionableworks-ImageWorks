[package]
name = "iw-app"
description = "ImageWorks desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "imageworks"
path = "src/main.rs"

[dependencies]
iw-engine = { path = "../iw-engine" }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui_dock = "0.21"
rfd = "0.17"
png = "0.18"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = "0.21"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }

# Installers: `cargo packager --release -p iw-app --formats <dmg|nsis>`. See BUILD.md.
[package.metadata.packager]
product-name = "ImageWorks"
identifier = "com.questionableworks.imageworks"
publisher = "Questionableworks"
category = "GraphicsAndDesign"
before-packaging-command = "cargo build --release -p iw-app"
# macOS uses the .icns, Windows the .ico, Linux the PNGs.
icons = ["assets/icon.icns", "assets/icon.ico", "assets/icon-32.png", "assets/icon-128.png", "assets/icon-256.png", "assets/icon-512.png"]
out-dir = "../../dist"
binaries-dir = "../../target/release"
